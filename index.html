<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">document.addEventListener('DOMContentLoaded', () => {
            const initialView = document.getElementById('initial-state');
            const resultView = document.getElementById('result-state');
            const envelopeBtn = document.getElementById('envelope-btn');
            const flap = document.getElementById('envelope-flap');
            const resetBtn = document.getElementById('reset-btn');
            const blessingText = document.getElementById('blessing-text');
            const sparkles = document.querySelectorAll('.sparkle');
            const confettiContainer = document.getElementById('confetti-container');
            const glitterContainer = document.getElementById('glitter-container');

            const blessings = ["考神附体 🙏", "逢考必过 ✨", "超常发挥 🚀", "下笔如有神 ✍️", "全都会做 💯", "幸运值 100% 🍀", "题目一看就会 😎", "蒙的都对 🎯", "GPA 4.0 稳了 🔥", "读的都有出 🤩"];
            const colors = ['#ffb3b1', '#ffe16d', '#feb6c4', '#ffdad8', '#db313f'];

            function createConfetti() {
                confettiContainer.innerHTML = '';
                for (let i = 0; i < 40; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti animate-confetti';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const tx = (Math.random() - 0.5) * 400 + 'px';
                    const ty = (Math.random() - 0.5) * 400 + 'px';
                    const tr = Math.random() * 720 + 'deg';
                    
                    confetti.style.backgroundColor = color;
                    confetti.style.left = '50%';
                    confetti.style.top = '50%';
                    confetti.style.setProperty('--tx', tx);
                    confetti.style.setProperty('--ty', ty);
                    confetti.style.setProperty('--tr', tr);
                    confetti.style.animationDelay = Math.random() * 0.1 + 's';
                    
                    confettiContainer.appendChild(confetti);
                }
            }

            function createGlitter() {
                glitterContainer.innerHTML = '';
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'glitter-particle';
                    const size = Math.random() * 4 + 2 + 'px';
                    particle.style.width = size;
                    particle.style.height = size;
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 2 + 's';
                    glitterContainer.appendChild(particle);
                }
            }

            envelopeBtn.addEventListener('click', () => {
                flap.style.transform = 'rotateX(180deg)';
                envelopeBtn.classList.remove('animate-breathe');
                
                sparkles.forEach((s, i) => {
                    setTimeout(() => {
                        s.classList.add('active');
                        s.style.left = `${Math.random() * 80 + 10}%`;
                        s.style.top = `${Math.random() * 50 + 20}%`;
                    }, i * 100);
                });

                setTimeout(() => {
                    initialView.classList.add('opacity-0');
                    setTimeout(() => {
                        initialView.classList.add('hidden');
                        initialView.classList.remove('flex');
                        
                        blessingText.textContent = blessings[Math.floor(Math.random() * blessings.length)];
                        
                        resultView.classList.remove('state-hidden');
                        resultView.classList.add('state-visible');
                        
                        createConfetti();
                        createGlitter();
                    }, 300);
                }, 800);
            });

            resetBtn.addEventListener('click', () => {
                resultView.classList.remove('state-visible');
                resultView.classList.add('state-hidden');
                
                initialView.classList.remove('hidden');
                initialView.classList.add('flex');
                
                requestAnimationFrame(() => {
                    initialView.classList.remove('opacity-0');
                    flap.style.transform = 'rotateX(0deg)';
                    envelopeBtn.classList.add('animate-breathe');
                    sparkles.forEach(s => s.classList.remove('active'));
                    confettiContainer.innerHTML = '';
                    glitterContainer.innerHTML = '';
                });
            });
        });</script>

<style>
        .envelope-container { perspective: 1000px; }
        .envelope-flap { transform-origin: top; transition: transform 0.8s ease-in-out; }
        .state-hidden { display: none !important; opacity: 0; }
        .state-visible { display: flex !important; animation: fadeInScale 0.6s ease-out forwards; }
        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes sparkleOut {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-50px); opacity: 0; }
        }
        .animate-breathe { animation: breathe 3s infinite ease-in-out; }
        .sparkle { position: absolute; pointer-events: none; opacity: 0; }
        .sparkle.active { animation: sparkleOut 0.8s ease-out forwards; }
    
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        .animate-gradient { background: linear-gradient(-45deg, #fff8f5, #fcf2ed, #fff8f5, #f6ece7); background-size: 400% 400%; animation: gradientBG 15s ease infinite; }
        .floating-element { animation: float 6s ease-in-out infinite; }
        .shine-overlay {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
            pointer-events: none;
        }
        .ribbon-left {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 50px;
            height: 50px;
            background: var(--tw-primary);
            clip-path: polygon(100% 0, 0 0, 0 100%);
            z-index: 10;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
        }
        .ribbon-right {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 50px;
            height: 50px;
            background: var(--tw-tertiary-fixed-dim);
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            z-index: 10;
            filter: drop-shadow(-2px 2px 2px rgba(0,0,0,0.1));
        }
    
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
        }
        @keyframes confettiBoom {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--tr));
                opacity: 0;
            }
        }
        .animate-confetti {
            animation: confettiBoom 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
    
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .glitter-particle {
            position: absolute;
            background: rgba(255, 153, 0, 0.541);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            animation: twinkle 1.5s infinite ease-in-out;
        }
    </style>
